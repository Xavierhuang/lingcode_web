# Production nginx config for lingcode.dev — the source of truth.
#
# Deploy with:
#   scp website/nginx-lingcode.conf root@45.55.39.39:/etc/nginx/sites-available/lingcode.dev
#   ssh root@45.55.39.39 'nginx -t && systemctl reload nginx'
#
# TLS cert is managed by certbot (renewed via systemd timer). The cert at
# /etc/letsencrypt/live/lingcode.dev/ has both `lingcode.dev` and
# `www.lingcode.dev` as SANs — required for the 301 on www to present a
# valid cert before redirecting.
#
# ─── Canonicalization model ──────────────────────────────────────────────────
# Apex (lingcode.dev) is canonical. `www.*` and `http://*` 301 to apex in one hop.
# Before this split, the single 443 block served `server_name lingcode.dev www.*`
# with identical content, which caused Search Console to file every www URL as
# "Alternate page with canonical tag" (wasting crawl budget) even though the
# <link rel="canonical"> tag was correct.
# ─────────────────────────────────────────────────────────────────────────────

# HTTPS apex — serves the site
server {
    server_name lingcode.dev;
    root /var/www/html;
    index index.html;
    include /etc/nginx/snippets/lingcode-api.conf;

    # Consolidate stale /docs/* paths that Googlebot discovered in March to their
    # current canonical URLs.
    location = /docs/privacy.html { return 301 /privacy.html; }
    location = /docs/support.html { return 301 /support.html; }
    location = /docs/terms.html   { return 301 /terms.html; }

    # ─── Orphan cleanup ──────────────────────────────────────────────────────
    # deploy.sh rsyncs WITHOUT --delete, so /var/www/html is a permanent
    # superset of the repo: pages deleted from git kept serving 200 forever.
    # An audit found 21 such files with no source, all self-canonical and
    # indexable, competing with their live replacements. Each is 301'd to its
    # nearest equivalent so any accumulated link equity is preserved; the
    # dead ones below return 410 so Google drops them outright.
    #
    # Deleting the files from the droplet is NOT enough on its own — without
    # these rules they would 404 and simply lose the equity instead.
    location = /best-practices-ai-coding.html    { return 301 /best-practices.html; }
    location = /deploy-in-minutes.html           { return 301 /getting-started.html; }
    location = /guides.html                      { return 301 /tutorials.html; }
    location = /marketplace.html                 { return 301 /tutorials/publish-a-plugin-to-a-marketplace.html; }
    location = /plugins.html                     { return 301 /tutorials/install-and-configure-plugins.html; }
    location = /remote-control.html              { return 301 /remote.html; }
    location = /tutorials/ci-cd-with-github-actions.html { return 301 /tutorials/automate-deploys-with-github-actions.html; }

    # zh orphans. Four have no Chinese counterpart, so they fall back to the
    # nearest live page rather than a 404.
    location = /zh/best-practices-ai-coding.html { return 301 /zh/tutorials.html; }
    location = /zh/deploy-in-minutes.html        { return 301 /zh/; }
    location = /zh/guides.html                   { return 301 /zh/tutorials.html; }
    location = /zh/remote-control.html           { return 301 /remote.html; }
    location = /zh/docs/privacy.html             { return 301 /zh/privacy.html; }
    location = /zh/docs/support.html             { return 301 /zh/support.html; }
    location = /zh/docs/terms.html               { return 301 /terms.html; }

    # Never had a canonical home: nginx's stock page and two .bak drafts.
    location = /index.nginx-debian.html { return 410; }
    location = /pitch-30min.bak.html    { return 410; }
    location = /pitch-investor.bak.html { return 410; }
    # ─────────────────────────────────────────────────────────────────────────

    # Clean URLs for key marketing pages.
    location = /pitch { return 301 /pitch.html; }
    location = /cloud { return 301 /cloud.html; }

    # Admin pages — stricter than the global `no-cache` below. The admin
    # dashboard ships its JS inline in the HTML, and a stale browser cache
    # of admin-dashboard.html locks the user out of bug fixes to that JS
    # until they manually clear cache (happened in practice: admin saw
    # "Loading…" forever after a deploy because the cached HTML referenced
    # the old endpoint shape). `no-store` forbids the browser from writing
    # the response to disk OR memory cache — every visit fetches afresh.
    # `must-revalidate` forbids serving a stale response if revalidation
    # fails for any reason. Listed BEFORE the generic `\.html$` location
    # so nginx's regex-order evaluation picks this one first for /admin-*.
    location ~* ^/admin(?:-|\.|/) {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ =404;
    }

    # HTML must revalidate every visit. Without this, browsers heuristically
    # cache HTML for hours, so a deploy doesn't reach users until they
    # manually hard-refresh. JS / CSS / fonts are still cached aggressively
    # because the entry-point script tag carries a ?v= cache-bust.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 404.html exists but nothing pointed at it, so every dead URL returned
    # nginx's stock "404 Not Found" page. `internal` keeps /404.html itself
    # from being fetched directly and indexed as a soft-404.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # website/node_modules/ (27 MB of better-sqlite3) was rsynced to the web
    # root and served. deploy.sh now excludes it, but the copy already on the
    # droplet persists because there is no --delete.
    location ^~ /node_modules/ { return 404; }

    location / { try_files $uri $uri/ =404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lingcode.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lingcode.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTPS www → apex (301)
server {
    server_name www.lingcode.dev;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lingcode.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingcode.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lingcode.dev$request_uri;
}

# HTTP (both hosts) → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name lingcode.dev www.lingcode.dev;
    return 301 https://lingcode.dev$request_uri;
}
