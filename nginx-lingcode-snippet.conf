# Paste inside: server { ... } for lingcode.dev
# Or: sudo cp nginx-api-locations.conf /etc/nginx/snippets/lingcode-api.conf
# Then add one line inside that server block:
#   include /etc/nginx/snippets/lingcode-api.conf;
# Then: sudo nginx -t && sudo systemctl reload nginx

# /api/account/cloud-compute/ — owner-authed compute tier endpoints, the only
# /api/ surface that legitimately uploads multi-MB request bodies (the
# `PUT /jobs/:jobId/image` docker tarball intake, server-side cap 2 GB per
# COMPUTE_MAX_IMAGE_BYTES in cloud-compute.js). Scoped so the rest of /api/
# keeps its smaller default below and can't accept GB-scale bodies.
#
# `^~` makes nginx match this prefix WITHOUT falling through to the regex
# location set; the 600s timeouts match the runner's docker-load window.
# proxy_request_buffering stays on (default) — nginx buffers the body to its
# client_body_temp_path before forwarding; with 2g that temp dir needs the room.
location ^~ /api/account/cloud-compute/ {
    client_max_body_size 2g;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    # Vision prompts ship base64-encoded images; nginx default 1m would
    # 413 anything past one ~700KB image. Express on the inference route
    # already allows 50mb; align nginx to the same ceiling.
    # `proxy_request_buffering` (REQUEST body) stays on — turning it off
    # was dropping connections mid-upload for large bodies.
    # `proxy_buffering` (RESPONSE body) is also left on globally; the
    # streaming inference route (/api/inference/anthropic) opts out
    # per-response via the `X-Accel-Buffering: no` header it sets
    # itself, which nginx honors without breaking non-streaming JSON
    # responses.
    client_max_body_size 60m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /oauth/ {
    proxy_pass http://127.0.0.1:3000/oauth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /auth/ {
    proxy_pass http://127.0.0.1:3000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /p/<id> — public short-link redirect for shared prototypes.
# 302s to /try.html#<key>=<base64-payload> via the Node API.
location /p/ {
    proxy_pass http://127.0.0.1:3000/p/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /r/<code> — marketer referral link (referrals.js). Logs a click, sets the
# lc_ref cookie, then 302s to the DMG download. Must be proxied (not served as a
# static file) so the click is recorded + the cookie set.
location /r/ {
    proxy_pass http://127.0.0.1:3000/r/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /apps/<uuid>/ — serves deployed "LingCode Cloud" apps from the Node app
# (cloud-apps.js serving route). MUST be proxied, not served as static files,
# or the deploy link 404s against /var/www/html. ^~ stops the \.html$ / ^/admin
# regex locations from stealing /apps/*.html sub-pages. Bare proxy_pass (no
# path) preserves the full /apps/... URI; Node handles the no-slash 301 itself.
location ^~ /apps/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /ws/ — WebSocket upgrade for /try collaborative editing.
# Real-time Yjs sync over /ws/collab/:prototypeId. The 24h read/send
# timeout keeps idle WS connections alive (y-websocket pings every 30s).
location /ws/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ── Desktop extension registry (LingCode IDE gallery) ───────────────────────
# The IDE browses lingcode.dev/extensions; we fetch the upstream registry
# server-side so the client only ever talks to lingcode.dev (never the upstream
# host). `^~` keeps the \.html$ / ^/admin regex locations from stealing
# sub-paths. Extension downloads 307 to object storage; we intercept and follow
# that redirect server-side so the storage host is never exposed to the client.
location ^~ /extensions {
    proxy_pass https://api.zed.dev;
    proxy_ssl_server_name on;
    proxy_set_header Host api.zed.dev;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @extensions_archive;
}
location @extensions_archive {
    internal;
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    set $extensions_archive_url $upstream_http_location;
    proxy_pass $extensions_archive_url;
    proxy_ssl_server_name on;
    proxy_set_header Host zed-extensions.nyc3.digitaloceanspaces.com;
}
